server:
  port: 8084

spring:
  application:
    name: ai-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/mindcare_db?currentSchema=ai_schema}
    username: ${DB_USERNAME:postgres_admin}
    password: ${DB_PASSWORD:secretpassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    schemas: ai_schema
    default-schema: ai_schema

gemini:
  api-key: ${GEMINI_API_KEY:}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
  embedding-model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-2}
  chat-model: ${GEMINI_CHAT_MODEL:gemini-3.1-flash-lite}
  fallback-chat-model: ${GEMINI_FALLBACK_CHAT_MODEL:gemini-3.1-flash-lite}
  embedding-dimensions: 768

rag:
  default-top-k: 5
  max-top-k: 10
  similarity-threshold: 0.35
  chunk-size-characters: 1800
  chunk-overlap-characters: 250

ai:
  stress-model:
    enabled: ${STRESS_MODEL_ENABLED:false}
    path: ${STRESS_MODEL_PATH:../ml-training/models/stress-classifier-v3.onnx}
    version: ${STRESS_MODEL_VERSION:stress-classifier-v3}
    expected-features: 25
  wellness-model:
    enabled: ${WELLNESS_MODEL_ENABLED:false}
    feature-version: lifesnaps-features-v1
    expected-features: 42
    version: lifesnaps-v1
    sleep-minutes:
      path: ${WELLNESS_SLEEP_MODEL_PATH:../ml-training/models/lifesnaps-sleep-minutes-v1.onnx}
      metadata-path: ${WELLNESS_SLEEP_METADATA_PATH:../ml-training/models/lifesnaps-sleep-minutes-v1.metadata.json}
      model-version: lifesnaps-sleep-minutes-v1
    steps:
      path: ${WELLNESS_STEPS_MODEL_PATH:../ml-training/models/lifesnaps-steps-v1.onnx}
      metadata-path: ${WELLNESS_STEPS_METADATA_PATH:../ml-training/models/lifesnaps-steps-v1.metadata.json}
      model-version: lifesnaps-steps-v1
    resting-heart-rate:
      path: ${WELLNESS_RESTING_HR_MODEL_PATH:../ml-training/models/lifesnaps-resting-hr-v1.onnx}
      metadata-path: ${WELLNESS_RESTING_HR_METADATA_PATH:../ml-training/models/lifesnaps-resting-hr-v1.metadata.json}
      model-version: lifesnaps-resting-hr-v1
  conversation-retention-days: ${AI_CONVERSATION_RETENTION_DAYS:365}
  conversation-retention-cron: ${AI_CONVERSATION_RETENTION_CRON:0 20 3 * * *}
