server:
  port: 8084

spring:
  application:
    name: ai-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/mindcare_db?currentSchema=ai_schema}
    username: ${DB_USERNAME:postgres_admin}
    password: ${DB_PASSWORD:secretpassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    schemas: ai_schema
    default-schema: ai_schema

gemini:
  api-key: ${GEMINI_API_KEY:}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
  embedding-model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-2}
  chat-model: ${GEMINI_CHAT_MODEL:gemini-3.1-flash-lite}
  fallback-chat-model: ${GEMINI_FALLBACK_CHAT_MODEL:gemini-3.1-flash-lite}
  embedding-dimensions: 768

rag:
  default-top-k: 5
  max-top-k: 10
  similarity-threshold: 0.35
  chunk-size-characters: 1800
  chunk-overlap-characters: 250
