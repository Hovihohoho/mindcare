server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: booking-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/mindcare_db?currentSchema=booking_schema}
    username: ${DB_USERNAME:postgres_admin}
    password: ${DB_PASSWORD:secretpassword}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: ${JPA_FORMAT_SQL:false}

  flyway:
    enabled: true
    create-schemas: true
    schemas: booking_schema
    default-schema: booking_schema
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true

  jackson:
    time-zone: UTC

eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

logging:
  level:
    root: INFO
    com.mindcare.bookingservice: ${APP_LOG_LEVEL:INFO}
    org.hibernate.SQL: ${HIBERNATE_SQL_LOG_LEVEL:WARN}

booking:
  auth-adapter:
    mode: ${BOOKING_AUTH_ADAPTER_MODE:unconfigured}
    base-url: ${AUTH_SERVICE_URI:http://localhost:8081}
  payment:
    required: ${BOOKING_PAYMENT_REQUIRED:true}
  maintenance:
    fixed-delay: ${BOOKING_MAINTENANCE_FIXED_DELAY_MS:30000}
  policy:
    slot-hold-duration: ${BOOKING_SLOT_HOLD_DURATION:15m}
    automatic-refund-cutoff: ${BOOKING_AUTOMATIC_REFUND_CUTOFF:24h}
    cancellation-closed-cutoff: ${BOOKING_CANCELLATION_CLOSED_CUTOFF:2h}
    cancellation-decision-timeout: ${BOOKING_CANCELLATION_DECISION_TIMEOUT:60m}
    chat-open-before: ${BOOKING_CHAT_OPEN_BEFORE:24h}
    chat-close-after: ${BOOKING_CHAT_CLOSE_AFTER:24h}
    no-show-grace-period: ${BOOKING_NO_SHOW_GRACE_PERIOD:15m}
    completion-review-timeout: ${BOOKING_COMPLETION_REVIEW_TIMEOUT:24h}
