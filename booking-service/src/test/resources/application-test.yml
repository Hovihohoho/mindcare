spring:
  datasource:
    url: jdbc:postgresql://localhost:1/booking_test_metadata_only
    username: test
    password: test
    hikari:
      minimum-idle: 0
      initialization-fail-timeout: -1
  flyway:
    enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        boot:
          allow_jdbc_metadata_access: false
  task:
    scheduling:
      enabled: false

eureka:
  client:
    enabled: false

booking:
  notification:
    enabled: false
  payment:
    required: false
