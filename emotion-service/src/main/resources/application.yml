server:
  port: 8083

app:
  internal-secret: ${INTERNAL_SERVICE_SECRET:local-internal-secret}
  auth-service-url: ${AUTH_SERVICE_URL:http://localhost:8081}
  risk-notifications:
    enabled: ${RISK_NOTIFICATIONS_ENABLED:true}
    poll-ms: ${RISK_NOTIFICATIONS_POLL_MS:5000}

spring:
  application:
    name: emotion-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/mindcare_db?currentSchema=emotion_schema}
    username: ${DB_USERNAME:postgres_admin}
    password: ${DB_PASSWORD:secretpassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    schemas: emotion_schema
    default-schema: emotion_schema

eureka:
  client:
    enabled: false
    service-url:
      defaultZone: http://localhost:8761/eureka/
mindcare:
  seed-assessments: ${SEED_ASSESSMENTS:false}

# Production must not inherit local credentials. Activate prod or production.
---
spring:
  config:
    activate:
      on-profile: "prod | production"
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

app:
  internal-secret: ${INTERNAL_SERVICE_SECRET}
