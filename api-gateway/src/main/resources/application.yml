server:
  port: 8079

mindcare:
  auth-service-uri: ${AUTH_SERVICE_URI:http://localhost:8081}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - ${FRONTEND_URL:http://localhost:5173}
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - Authorization
                  - Content-Type
                  - Idempotency-Key
                  - X-Correlation-Id
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/auth/**
            - id: emotion-service
              uri: ${EMOTION_SERVICE_URI:http://localhost:8083}
              predicates:
                - Path=/api/v1/emotion-journals/**,/api/v1/emotion-trends/**,/api/v1/assessments/**,/api/v1/assessment-results/**,/api/v1/risk-alerts/**,/api/v1/health-metrics/**,/api/v1/admin/assessments/**
            - id: ai-service
              uri: ${AI_SERVICE_URI:http://localhost:8084}
              predicates:
                - Path=/api/ai/**
            - id: user-engagement
              uri: ${AUTH_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/notifications/**,/api/v1/bookmarks/**
            - id: ai-websocket
              uri: ${AI_WEBSOCKET_URI:ws://localhost:8084}
              predicates:
                - Path=/ws/ai/**
            - id: notification-websocket
              uri: ${AUTH_WEBSOCKET_URI:ws://localhost:8081}
              predicates:
                - Path=/ws/notifications/**
