server:
  port: 8079

mindcare:
  auth-service-uri: ${AUTH_SERVICE_URI:http://localhost:8081}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "*"
                allowedMethods: "*"
                allowedHeaders: "*"
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/auth/**
            - id: booking-service
              uri: ${BOOKING_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/v1/bookings/**,/api/v1/expert/**,/api/v1/experts/**,/api/v1/conversations/**,/api/v1/payment-webhooks/**
            - id: emotion-service
              uri: ${EMOTION_SERVICE_URI:http://localhost:8083}
              predicates:
                - Path=/api/v1/emotion-journals/**,/api/v1/emotion-trends/**,/api/v1/assessments/**,/api/v1/assessment-results/**,/api/v1/admin/assessments/**
            - id: ai-service
              uri: ${AI_SERVICE_URI:http://localhost:8084}
              predicates:
                - Path=/api/ai/**
            - id: user-engagement
              uri: ${AUTH_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/notifications/**,/api/v1/bookmarks/**
            - id: ai-websocket
              uri: ${AI_WEBSOCKET_URI:ws://localhost:8084}
              predicates:
                - Path=/ws/ai/**
            - id: expert-websocket
              uri: ${BOOKING_WEBSOCKET_URI:ws://localhost:8082}
              predicates:
                - Path=/ws/expert/**
            - id: notification-websocket
              uri: ${AUTH_WEBSOCKET_URI:ws://localhost:8081}
              predicates:
                - Path=/ws/notifications/**

security:
  jwt:
    secret: ${JWT_SECRET:TWluZENhcmUtRGV2ZWxvcG1lbnQtSldULVNlY3JldC0yMDI2IQ==}
