name: AI and push quality

on:
  pull_request:
    paths:
      - 'ai-service/**'
      - 'auth-service/**'
      - 'emotion-service/**'
      - 'mobile-app/**'
      - '.github/workflows/ai-push-quality.yml'
  workflow_dispatch:

jobs:
  backend-and-rag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Make Maven wrappers executable
        run: chmod +x auth-service/mvnw emotion-service/mvnw
      - name: Test push and reminder reliability
        working-directory: auth-service
        run: ./mvnw test '-Dtest=ReminderPreferenceTest,ExpoPushSenderTest,ExpoPushReceiptSchedulerTest,NotificationControllerTest'
      - name: Test journal conversion and stress trend
        working-directory: emotion-service
        run: ./mvnw test '-Dtest=EmotionJournalServiceImplTest,EmotionJournalControllerIntegrationTest,StressPredictionRecordServiceTest'
      - name: Run deterministic RAG safety gate
        working-directory: ai-service
        run: mvn test '-Dtest=GeminiClientTest,GoldenSafetyTest,CrisisRiskDetectorTest,RagChatServiceTest,AiPrivacySecurityTest,AiConversationServiceTest'
      - name: Test RAG evaluation scorer
        run: python -m unittest discover -s ai-service/evaluation -p test_evaluation.py

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
