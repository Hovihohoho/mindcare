server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/mindcare_db?currentSchema=auth_schema}
    username: ${DB_USERNAME:postgres_admin}
    password: ${DB_PASSWORD:secretpassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Tắt tự động tạo bảng của Hibernate vì đã có Flyway
    show-sql: true
  flyway:
    schemas: auth_schema
    default-schema: auth_schema
    ignore-migration-patterns: "*:missing"
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  mail-from: ${MAIL_FROM:no-reply@mindcare.local}
  verification-expiration-minutes: 30
  internal-secret: ${INTERNAL_SERVICE_SECRET}
  default-consultation-fee: ${DEFAULT_CONSULTATION_FEE:300000}
